<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>genid — random data generator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="description" content="Portable random data generator: passwords, passphrases, usernames, UUIDs, ULIDs, hex, base64, tokens. Runs entirely in your browser.">
<style>
  :root {
    --bg: #12151a;
    --panel: #191d24;
    --border: #262b34;
    --border-active: #3a4250;
    --text: #dde2e8;
    --text-dim: #6f7787;
    --text-faint: #4b5262;
    --accent: #62b891;
    --accent-dim: #3c6e57;
    --warn: #d99a5b;
    --danger: #d97070;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  .toolset-nav {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    max-width: min(92vw, 1000px);
    margin: 0 auto;
    width: 100%;
  }
  .toolset-nav a {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 10px;
  }
  .toolset-nav a:hover { color: var(--text); border-color: var(--border-active); }
  .toolset-nav a.active { color: var(--accent); border-color: var(--accent-dim); background: rgba(98, 184, 145, 0.07); }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
  }

  .wrap { width: 100%; max-width: min(92vw, 1000px); }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  header .name { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  header .name .dot { color: var(--accent); }
  header .tag { font-size: 12px; color: var(--text-faint); }

  nav.cmds {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }

  nav.cmds button {
    font-family: var(--mono);
    font-size: 13px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 7px 12px;
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }

  nav.cmds button:hover { border-color: var(--border-active); color: var(--text); }
  nav.cmds button.active {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: rgba(98, 184, 145, 0.07);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .panel-title {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .opts { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 13px; }
  .opt { display: flex; align-items: center; gap: 7px; color: var(--text-dim); }
  .opt.wide { flex-basis: 100%; }
  .opt label { white-space: nowrap; }

  .opt select, .opt input[type="number"], .opt input[type="text"] {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 7px;
  }

  .opt input[type="number"] { width: 60px; }
  .opt input[type="text"] { width: 100%; min-width: 140px; }
  .opt.wide input[type="text"] { flex: 1; }
  .opt.checkbox { cursor: pointer; user-select: none; }
  .opt.checkbox input { accent-color: var(--accent); }

  .actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

  button.primary {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    background: var(--accent-dim);
    color: #d9f2e6;
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 9px 16px;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent); color: #0d1310; }

  button.ghost {
    font-family: var(--mono);
    font-size: 13px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 9px 14px;
    cursor: pointer;
  }
  button.ghost:hover { border-color: var(--border-active); color: var(--text); }

  .output { min-height: 40px; }

  .line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 6px;
  }

  .line .prompt { color: var(--accent); flex-shrink: 0; }
  .line .value { flex: 1; font-size: 14px; word-break: break-all; color: var(--text); white-space: pre-wrap; }

  .line button.copy {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 11px;
    background: transparent;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 8px;
    cursor: pointer;
  }
  .line button.copy:hover { color: var(--accent); border-color: var(--accent-dim); }
  .line button.copy.copied { color: var(--accent); }

  .meta { font-size: 12px; color: var(--text-faint); padding: 0 2px; margin-top: 4px; line-height: 1.6; }
  .meta .weak { color: var(--danger); }

  .decode-box {
    font-size: 13px;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .decode-box .k { color: var(--text-faint); }
  .decode-box .v { color: var(--accent); }
  .decode-box.err { color: var(--danger); }

  footer { margin-top: 28px; font-size: 12px; color: var(--text-faint); line-height: 1.7; }
  footer a { color: var(--text-dim); }

  .empty { color: var(--text-faint); font-size: 13px; padding: 4px 2px; }

  @media (max-width: 420px) { .opts { gap: 8px 14px; } }
</style>
</head>
<body>
<nav class="toolset-nav">
  <a href="./index.html" class="active">genid</a>
  <a href="./devkit.html">devkit</a>
</nav>
<div class="wrap">

  <header>
    <div>
      <div class="name">genid<span class="dot">.</span>web</div>
      <div class="tag">random data, generated in your browser</div>
    </div>
  </header>

  <nav class="cmds" id="cmds"></nav>

  <div class="panel">
    <div class="opts" id="opts"></div>
  </div>

  <div class="actions">
    <button class="primary" id="generateBtn">Generate</button>
    <button class="ghost" id="copyAllBtn">Copy all</button>
    <button class="ghost" id="clearBtn">Clear</button>
  </div>

  <div class="output" id="output">
    <div class="empty">— результат появится здесь —</div>
  </div>

  <footer>
    Всё выполняется локально, через Web Crypto API (<code>crypto.getRandomValues</code>).
    Ничего не отправляется на сервер — можно отключить интернет после загрузки страницы.<br>
    Оригинальный CLI: <a href="https://github.com/rjusm/genid" target="_blank" rel="noopener">genid.sh</a>
  </footer>

</div>

<script>
(function () {
  "use strict";

  // No-op outside Telegram — only activates when opened as a Telegram Mini App.
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  // ---------- RNG primitives ----------

  function randomBytes(n) {
    const b = new Uint8Array(n);
    crypto.getRandomValues(b);
    return b;
  }

  // Unbiased integer in [0, maxExclusive) via rejection sampling — mirrors
  // rand_index() in genid.sh (uses as many bytes as needed, not just one).
  function randomInt(maxExclusive) {
    if (maxExclusive <= 1) return 0;
    let bytesNeeded = 1, range = 256;
    while (range < maxExclusive) { bytesNeeded++; range *= 256; }
    const limit = Math.floor(range / maxExclusive) * maxExclusive;
    while (true) {
      const b = randomBytes(bytesNeeded);
      let val = 0;
      for (let i = 0; i < bytesNeeded; i++) val = val * 256 + b[i];
      if (val < limit) return val % maxExclusive;
    }
  }

  function randomChar(charset) {
    return charset[randomInt(charset.length)];
  }

  function randomString(charset, length) {
    let out = "";
    for (let i = 0; i < length; i++) out += randomChar(charset);
    return out;
  }

  function toHex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function toBase64(bytes) {
    let bin = "";
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }

  function filterOutChars(str, exclude) {
    return str.split("").filter(c => exclude.indexOf(c) === -1).join("");
  }

  // ---------- charsets ----------

  const SETS = {
    lower: "abcdefghijklmnopqrstuvwxyz",
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    digits: "0123456789",
    symbols: "!@#$%^&*()-_=+[]{}?",
  };
  // matches genid.sh's `tr -d -- 'loIO01'`
  const AMBIGUOUS = "loIO01";

  function stripAmbiguous(s) { return filterOutChars(s, AMBIGUOUS); }

  const STRENGTH_LENGTH = { low: 12, medium: 16, high: 20, paranoid: 32 };

  const ADJ = ["brave","calm","dusty","eager","fuzzy","giant","happy","icy","jolly","keen",
    "lively","misty","noble","odd","proud","quiet","rapid","sharp","tidy","urban",
    "vivid","witty","young","zesty","amber","bold","crisp","dark","east","fine"];
  const NOUN = ["otter","falcon","river","cloud","tiger","maple","stone","ember","delta","harbor",
    "lynx","meadow","quartz","raven","summit","tundra","vale","willow","zephyr","comet",
    "dune","ridge","fern","glade","heron","ivy","jade","knoll","lark"];

  const PASSPHRASE_WORDS = ("amber anchor ant apple armor ash axe barley barrel basil basket bay "
    + "beach bean bear bee beetle beige belt bend berry bitter black blade "
    + "blend blue bold bolt boot boulder bowl box brave bread breeze bright "
    + "broad bronze brook brown bucket build butter button cake calm camel candle "
    + "candy canyon cape carrot carry carve catch cave celery chain chair chalk "
    + "chase cheese cherry chisel clam clasp clay clever cliff climb cloak clock "
    + "cloud cloudy clove clutch coast coat cocoa coffee cold comet cool copper "
    + "coral corn crab crane crate crawl creek crimson crisp crow crystal cyan "
    + "damp date dawn deep deer delta desert desk dew dive dolphin drag "
    + "drift drill drop dry duck dune dusk dust dusty eager eagle early "
    + "ember emerald equinox falcon fierce fig finch fjord flame flat float fog "
    + "foggy fold forest forge fork fox fresh frog frost frosty galaxy garlic "
    + "gather gear gecko gentle giant glacier glass glide glove goat gold goose "
    + "grab grand granite grape gravel gray green grip guava gulf hail hammer "
    + "harbor hat haul hawk heavy helmet heron hill hinge hold honest honey "
    + "hornet horse humble humid hunt icy indigo island ivory jade jolly jump "
    + "jungle kind kiwi knife koala ladder lake lamp lantern late leap lemon "
    + "lever lift light lime lion lively loyal lynx magenta mango marble maroon "
    + "marsh mast meadow melon merry meteor mild milk mint mirror mist misty "
    + "mix mold moon moose moth mouse mud muddy mug nail narrow navy "
    + "nebula needle newt night noon oar oat ocean olive onion onyx orange "
    + "orbit otter owl paddle panda papaya peach peak pear pearl pebble pepper "
    + "pie pink plain planet plate pliers plum pond potato pour prairie proud "
    + "pull pulley puma purple push quick quiet rabbit rain rainy raven red "
    + "reef release rice rich ridge river roam robin rock rocky rope rough "
    + "ruby run sage sail salt salty sand sandy sapphire saw scarf scarlet "
    + "screw seal shallow shape shark sheep shelf shield shiny shore shrimp silver "
    + "simple slate slope slow smooth snail snow snowy soar sock solstice sour "
    + "spark spicy spider spill spin spoon spring squid star steep stir stone "
    + "stork storm stormy strait stretch sturdy sugar summit sunny swamp swan sweet "
    + "swift swim syrup table tan tea teal thick thin thread throw thyme "
    + "tiger tiny toad toast tomato topaz torch toss tundra twist valley vase "
    + "vest violet walk wander warm wasp weave whale wheat wheel whisk white "
    + "wide wind windy wise wolf wren wrench yellow zebra zipper").split(" ");

  const CROCKFORD32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";

  function crockfordEncode(value, nchars) {
    let out = "";
    for (let i = nchars - 1; i >= 0; i--) {
      const idx = Math.floor(value / Math.pow(2, i * 5)) % 32;
      out += CROCKFORD32[idx];
    }
    return out;
  }

  // ---------- generators ----------

  function genPassword(opts) {
    if (opts.mode === "passphrase") {
      const words = Math.max(2, opts.words || 5);
      const sep = opts.phraseSep || "-";
      const parts = [];
      for (let i = 0; i < words; i++) parts.push(PASSPHRASE_WORDS[randomInt(PASSPHRASE_WORDS.length)]);
      const value = parts.join(sep);
      const bits = Math.round(words * Math.log2(PASSPHRASE_WORDS.length) * 10) / 10;
      return { value, meta: opts.quiet ? "" : `wordlist=${PASSPHRASE_WORDS.length}, words=${words}, ~${bits} bits entropy` };
    }

    let classes;
    if (opts.charset) {
      classes = [opts.charset];
    } else {
      const useSymbols = opts.strength === "low" ? false : opts.useSymbols;
      classes = [SETS.lower, SETS.upper, SETS.digits];
      if (useSymbols) classes.push(SETS.symbols);
    }
    if (opts.noAmbiguous) classes = classes.map(stripAmbiguous);
    if (opts.excludeChars) classes = classes.map(c => filterOutChars(c, opts.excludeChars));
    if (classes.some(c => c.length === 0)) {
      return { value: "(error: a character class is empty once filters are applied)", meta: "" };
    }

    const charset = classes.join("");
    const nclasses = classes.length;
    const length = opts.length || STRENGTH_LENGTH[opts.strength];
    if (length < nclasses) {
      return { value: `(error: length ${length} too short for ${nclasses} required classes)`, meta: "" };
    }

    const pass = classes.map(c => c[randomInt(c.length)]);
    for (let i = 0; i < length - nclasses; i++) pass.push(charset[randomInt(charset.length)]);
    for (let i = pass.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);
      [pass[i], pass[j]] = [pass[j], pass[i]];
    }
    const value = pass.join("");
    const bits = Math.floor(length * Math.log2(charset.length) * 10) / 10;
    return { value, meta: opts.quiet ? "" : `charset=${charset.length}, length=${length}, ~${bits} bits estimated max entropy` };
  }

  function genUsername(opts) {
    if (opts.mode === "words") {
      const a = ADJ[randomInt(ADJ.length)];
      const n = NOUN[randomInt(NOUN.length)];
      const num = randomInt(90) + 10;
      const sep = opts.sep || "-";
      return { value: `${a}${sep}${n}${sep}${num}`, meta: "mode: words" };
    }
    const charset = SETS.lower + SETS.upper + SETS.digits;
    const length = opts.length || 10;
    return { value: randomString(charset, length), meta: `mode: random, length ${length}` };
  }

  function bytesToUuid(bytes) {
    const h = toHex(bytes);
    return [h.slice(0,8), h.slice(8,12), h.slice(12,16), h.slice(16,20), h.slice(20)].join("-");
  }

  function genUuid(opts) {
    if (opts.version === "7") {
      const ts = Date.now();
      const tsHex = ts.toString(16).padStart(12, "0");
      const bytes = new Uint8Array(16);
      for (let i = 0; i < 6; i++) bytes[i] = parseInt(tsHex.substr(i * 2, 2), 16);
      bytes.set(randomBytes(10), 6);
      bytes[6] = (bytes[6] & 0x0f) | 0x70;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      return { value: bytesToUuid(bytes), meta: "UUID v7 — time-ordered, sortable" };
    }
    const bytes = randomBytes(16);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    return { value: bytesToUuid(bytes), meta: "UUID v4 — random" };
  }

  function genUlid() {
    const ms = Date.now();
    const tsPart = crockfordEncode(ms, 10);
    const r1 = randomBytes(5).reduce((v, b) => v * 256 + b, 0);
    const r2 = randomBytes(5).reduce((v, b) => v * 256 + b, 0);
    const value = tsPart + crockfordEncode(r1, 8) + crockfordEncode(r2, 8);
    return { value, meta: "ULID — Crockford-base32, sortable, same timestamp source as uuid v7" };
  }

  function genHex(opts) {
    let bytes = opts.bytes || 32;
    let targetLen = null;
    if (opts.unit === "length") {
      targetLen = opts.value || 64;
      bytes = Math.ceil(targetLen / 2);
    } else {
      bytes = opts.value || 32;
    }
    let hex = toHex(randomBytes(bytes));
    if (targetLen !== null) hex = hex.slice(0, targetLen);
    return { value: hex, meta: `${bytes} bytes${targetLen !== null ? ` → truncated to ${targetLen} chars` : ` → ${bytes * 2} hex chars`}` };
  }

  function genBase64(opts) {
    const n = opts.bytes || 32;
    return { value: toBase64(randomBytes(n)), meta: `${n} bytes → base64` };
  }

  function genToken(opts) {
    let charset = opts.charset || "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
    if (opts.excludeChars) charset = filterOutChars(charset, opts.excludeChars);
    if (!charset) return { value: "(error: --exclude-chars removed every character from the charset)", meta: "" };
    const length = opts.length || 32;
    return { value: randomString(charset, length), meta: `URL-safe alphabet size ${charset.length}, length ${length}` };
  }

  function decodeInspect(raw) {
    const value = (raw || "").trim();
    const lower = value.toLowerCase();
    const upper = value.toUpperCase();

    if (lower.length === 36 && lower[8] === "-" && lower[13] === "-" && lower[18] === "-" && lower[23] === "-") {
      const stripped = lower.replace(/-/g, "");
      if (/^[0-9a-f]{32}$/.test(stripped)) {
        const version = stripped[12];
        let out = `Format: UUID\nVersion: ${version}\n`;
        if (version === "7") {
          const ms = parseInt(stripped.slice(0, 12), 16);
          out += `Timestamp: ${new Date(ms).toISOString().replace("T", " ").replace("Z", " UTC")}`;
        } else {
          out += `Timestamp: not embedded (only UUIDv7 carries one; this is v${version})`;
        }
        return out;
      }
    }

    if (upper.length === 26 && /^[0-9A-HJKMNP-TV-Z]{26}$/.test(upper)) {
      const tsChars = upper.slice(0, 10);
      let val = 0;
      for (const c of tsChars) val = val * 32 + CROCKFORD32.indexOf(c);
      const ms = val % Math.pow(2, 48);
      return `Format: ULID\nTimestamp: ${new Date(ms).toISOString().replace("T", " ").replace("Z", " UTC")}`;
    }

    return null;
  }

  // ---------- command definitions ----------

  const SHARED_FIELDS = [
    { key: "envName", type: "text", label: "env name (-E)", default: "", wide: false, placeholder: "e.g. DB_PASSWORD" },
    { key: "nullSep", type: "checkbox", label: "NUL-separated on Copy all (-0)", default: false },
  ];

  const COMMANDS = {
    password: {
      label: "password",
      fields: [
        { key: "mode", type: "select", label: "mode", options: [["standard","standard"],["passphrase","passphrase"]], default: "standard" },
        { key: "strength", type: "select", label: "strength", options: [["low","low"],["medium","medium"],["high","high"],["paranoid","paranoid"]], default: "medium", showIf: v => v.mode === "standard" },
        { key: "length", type: "number", label: "length (override)", default: null, min: 1, max: 256, allowEmpty: true, showIf: v => v.mode === "standard" },
        { key: "useSymbols", type: "checkbox", label: "symbols", default: true, showIf: v => v.mode === "standard" && v.strength !== "low" },
        { key: "noAmbiguous", type: "checkbox", label: "no ambiguous (-A)", default: false, showIf: v => v.mode === "standard" },
        { key: "charset", type: "text", label: "charset (-C, overrides classes)", default: "", showIf: v => v.mode === "standard" },
        { key: "excludeChars", type: "text", label: "exclude chars (-X)", default: "", showIf: v => v.mode === "standard" },
        { key: "words", type: "number", label: "words", default: 5, min: 2, max: 20, showIf: v => v.mode === "passphrase" },
        { key: "phraseSep", type: "text", label: "separator", default: "-", showIf: v => v.mode === "passphrase" },
        { key: "quiet", type: "checkbox", label: "quiet (-q, hide entropy)", default: false },
        { key: "count", type: "number", label: "count", default: 1, min: 1, max: 20 },
      ],
      run: genPassword,
    },
    username: {
      label: "username",
      fields: [
        { key: "mode", type: "select", label: "mode", options: [["random","random"],["words","words"]], default: "random" },
        { key: "length", type: "number", label: "length", default: 10, min: 4, max: 32, showIf: v => v.mode === "random" },
        { key: "sep", type: "text", label: "separator", default: "-", showIf: v => v.mode === "words" },
        { key: "count", type: "number", label: "count", default: 1, min: 1, max: 20 },
      ],
      run: genUsername,
    },
    uuid: {
      label: "uuid",
      fields: [
        { key: "version", type: "select", label: "version", options: [["4","v4"],["7","v7"]], default: "4" },
        { key: "count", type: "number", label: "count", default: 1, min: 1, max: 20 },
      ],
      run: genUuid,
    },
    ulid: {
      label: "ulid",
      fields: [
        { key: "count", type: "number", label: "count", default: 1, min: 1, max: 20 },
      ],
      run: genUlid,
    },
    hex: {
      label: "hex",
      fields: [
        { key: "unit", type: "select", label: "unit", options: [["bytes","bytes (-b)"],["length","hex chars (-l)"]], default: "bytes" },
        { key: "value", type: "number", label: "value", default: 32, min: 1, max: 512 },
        { key: "count", type: "number", label: "count", default: 1, min: 1, max: 20 },
      ],
      run: genHex,
    },
    base64: {
      label: "base64",
      fields: [
        { key: "bytes", type: "number", label: "bytes (-b)", default: 32, min: 1, max: 256 },
        { key: "count", type: "number", label: "count", default: 1, min: 1, max: 20 },
      ],
      run: genBase64,
    },
    token: {
      label: "token",
      fields: [
        { key: "length", type: "number", label: "length (-l)", default: 32, min: 8, max: 256 },
        { key: "charset", type: "text", label: "charset (-C)", default: "" },
        { key: "excludeChars", type: "text", label: "exclude chars (-X)", default: "" },
        { key: "count", type: "number", label: "count", default: 1, min: 1, max: 20 },
      ],
      run: genToken,
    },
    inspect: {
      label: "inspect",
      special: true,
      fields: [
        { key: "value", type: "text", label: "UUID or ULID", default: "", wide: true, placeholder: "paste a UUID or ULID to decode" },
      ],
    },
  };

  // add shared -E/-0 fields to every generating command (not inspect)
  Object.keys(COMMANDS).forEach(k => {
    if (!COMMANDS[k].special) COMMANDS[k].fields.push(...SHARED_FIELDS);
  });

  // ---------- UI wiring ----------

  let current = "password";
  const state = {};
  Object.keys(COMMANDS).forEach(k => {
    state[k] = {};
    COMMANDS[k].fields.forEach(f => state[k][f.key] = f.default);
  });

  let lastGenerated = []; // for "copy all"

  const cmdsEl = document.getElementById("cmds");
  const optsEl = document.getElementById("opts");
  const outputEl = document.getElementById("output");

  function renderCmds() {
    cmdsEl.innerHTML = "";
    Object.keys(COMMANDS).forEach(key => {
      const btn = document.createElement("button");
      btn.textContent = COMMANDS[key].label;
      btn.className = key === current ? "active" : "";
      btn.addEventListener("click", () => {
        current = key;
        renderCmds();
        renderOpts();
        outputEl.innerHTML = '<div class="empty">— результат появится здесь —</div>';
        lastGenerated = [];
        document.getElementById("generateBtn").textContent = COMMANDS[key].special ? "Decode" : "Generate";
      });
      cmdsEl.appendChild(btn);
    });
  }

  function renderOpts() {
    optsEl.innerHTML = "";
    const cmd = COMMANDS[current];
    cmd.fields.forEach(f => {
      if (f.showIf && !f.showIf(state[current])) return;

      const wrap = document.createElement("div");
      wrap.className = "opt" + (f.type === "checkbox" ? " checkbox" : "") + (f.wide ? " wide" : "");

      if (f.type === "select") {
        const label = document.createElement("label");
        label.textContent = f.label;
        const select = document.createElement("select");
        f.options.forEach(([val, text]) => {
          const o = document.createElement("option");
          o.value = val; o.textContent = text;
          if (val === state[current][f.key]) o.selected = true;
          select.appendChild(o);
        });
        select.addEventListener("change", () => {
          state[current][f.key] = select.value;
          renderOpts();
        });
        wrap.appendChild(label);
        wrap.appendChild(select);
      } else if (f.type === "number") {
        const label = document.createElement("label");
        label.textContent = f.label;
        const input = document.createElement("input");
        input.type = "number";
        input.min = f.min; input.max = f.max;
        input.placeholder = f.allowEmpty ? "auto" : "";
        input.value = state[current][f.key] == null ? "" : state[current][f.key];
        input.addEventListener("change", () => {
          if (input.value === "" && f.allowEmpty) { state[current][f.key] = null; return; }
          let v = parseInt(input.value, 10);
          if (isNaN(v)) v = f.default;
          v = Math.max(f.min, Math.min(f.max, v));
          state[current][f.key] = v;
          input.value = v;
        });
        wrap.appendChild(label);
        wrap.appendChild(input);
      } else if (f.type === "text") {
        const label = document.createElement("label");
        label.textContent = f.label;
        const input = document.createElement("input");
        input.type = "text";
        if (f.placeholder) input.placeholder = f.placeholder;
        input.value = state[current][f.key] || "";
        input.addEventListener("input", () => { state[current][f.key] = input.value; });
        wrap.appendChild(label);
        wrap.appendChild(input);
      } else if (f.type === "checkbox") {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!state[current][f.key];
        input.addEventListener("change", () => { state[current][f.key] = input.checked; });
        label.appendChild(input);
        label.appendChild(document.createTextNode(" " + f.label));
        wrap.appendChild(label);
      }

      optsEl.appendChild(wrap);
    });
  }

  function legacyCopy(text) {
    // Fallback for contexts where navigator.clipboard is unavailable or
    // blocked (notably: pages opened directly as file://, which most
    // browsers treat as a non-secure origin for the Clipboard API).
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.left = "-1000px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text, btn) {
    const succeed = () => {
      btn.textContent = "copied";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = btn.dataset.label || "copy"; btn.classList.remove("copied"); }, 1200);
    };
    const fail = () => {
      btn.textContent = "select manually";
      setTimeout(() => { btn.textContent = btn.dataset.label || "copy"; }, 1600);
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(succeed).catch(() => {
        if (legacyCopy(text)) succeed(); else fail();
      });
    } else {
      if (legacyCopy(text)) succeed(); else fail();
    }
  }

  function formatLine(value, idx, total, envName) {
    if (envName) return total > 1 ? `${envName}_${idx}=${value}` : `${envName}=${value}`;
    return value;
  }

  function runInspect() {
    outputEl.innerHTML = "";
    const raw = state.inspect.value || "";
    const box = document.createElement("div");
    box.className = "panel decode-box";
    if (!raw.trim()) {
      box.textContent = "Вставь UUID или ULID выше и нажми Decode.";
    } else {
      const result = decodeInspect(raw);
      if (result === null) {
        box.classList.add("err");
        box.textContent = "unrecognized format: expected a UUID (8-4-4-4-12 hex) or a 26-character ULID";
      } else {
        box.textContent = result;
      }
    }
    outputEl.appendChild(box);
    lastGenerated = [];
  }

  function generate() {
    const cmd = COMMANDS[current];
    if (cmd.special) { runInspect(); return; }

    const opts = state[current];
    const count = opts.count || 1;
    outputEl.innerHTML = "";
    lastGenerated = [];

    let lastMeta = "";
    for (let i = 1; i <= count; i++) {
      const result = cmd.run(opts);
      lastMeta = result.meta;
      const display = formatLine(result.value, i, count, opts.envName);
      lastGenerated.push(display);

      const line = document.createElement("div");
      line.className = "line";

      const prompt = document.createElement("span");
      prompt.className = "prompt";
      prompt.textContent = ">";

      const value = document.createElement("span");
      value.className = "value";
      value.textContent = display;

      const copyBtn = document.createElement("button");
      copyBtn.className = "copy";
      copyBtn.textContent = "copy";
      copyBtn.dataset.label = "copy";
      copyBtn.addEventListener("click", () => copyText(display, copyBtn));

      line.appendChild(prompt);
      line.appendChild(value);
      line.appendChild(copyBtn);
      outputEl.appendChild(line);
    }

    if (lastMeta) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = lastMeta;
      outputEl.appendChild(meta);
    }
  }

  document.getElementById("generateBtn").addEventListener("click", generate);
  document.getElementById("clearBtn").addEventListener("click", () => {
    outputEl.innerHTML = '<div class="empty">— результат появится здесь —</div>';
    lastGenerated = [];
  });
  document.getElementById("copyAllBtn").addEventListener("click", (e) => {
    if (!lastGenerated.length) return;
    const nullSep = state[current] && state[current].nullSep;
    const joined = lastGenerated.join(nullSep ? "\u0000" : "\n");
    copyText(joined, e.target);
  });

  renderCmds();
  renderOpts();
})();
</script>
</body>
</html>
