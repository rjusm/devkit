<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>genid — random data generator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="description" content="Portable random data generator: passwords, passphrases, usernames, UUIDs, ULIDs, hex, base64, tokens, and a string inspector. Runs entirely in your browser.">
<style>
  :root {
    --bg: #0D1013;
    --panel: oklch(0.18 0.012 260);
    --panel-nested: oklch(0.14 0.01 260);
    --border: oklch(0.28 0.012 260);
    --border-active: oklch(0.4 0.02 260);
    --text: oklch(0.93 0.008 260);
    --text-dim: oklch(0.7 0.015 260);
    --text-faint: oklch(0.58 0.02 260);
    --accent: oklch(0.78 0.13 168);
    --accent-hover: oklch(0.87 0.13 168);
    --accent-dim: oklch(0.5 0.08 168);
    --accent-tint: oklch(0.3 0.05 168);
    --accent-ink: #06140F;
    --warn: oklch(0.72 0.13 80);
    --danger: oklch(0.78 0.14 25);
    --danger-border: oklch(0.45 0.12 25);
    --radius-card: 18px;
    --radius-control: 10px;
    --radius-pill: 999px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
    background: radial-gradient(1200px 500px at 50% -10%, oklch(0.24 0.03 190), var(--bg) 60%);
  }

  .wrap { width: 100%; max-width: min(92vw, 1000px); }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand-dot { width: 9px; height: 9px; border-radius: var(--radius-pill); background: var(--accent); box-shadow: 0 0 12px var(--accent); flex-shrink: 0; }
  header .name { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
  header .name .dot { color: var(--text-faint); }
  header .badge { font-size: 11px; color: var(--text-faint); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 3px 10px; }
  header nav.pages { display: flex; gap: 18px; font-family: var(--mono); font-size: 13px; }
  header nav.pages span.current { color: var(--text); }
  header nav.pages a { color: var(--text-faint); text-decoration: none; }
  header nav.pages a:hover { color: var(--text); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 20px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 16px; }
  .panel.builder { background: oklch(0.16 0.012 260); }

  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .panel-head .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); }
  .panel-head .status { font-size: 11.5px; color: var(--text-faint); }

  .empty-box { border: 1px dashed var(--border-active); border-radius: 12px; padding: 38px 20px; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--text-faint); }

  .hidden { display: none !important; }

  #results { display: flex; flex-direction: column; gap: 8px; }

  .result-row {
    display: flex; align-items: center; gap: 14px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 14px 16px;
  }
  .result-row .prompt { color: var(--accent); flex-shrink: 0; }
  .result-row code { font-size: 15px; line-height: 1.5; color: var(--text); word-break: break-all; flex: 1 1 auto; min-width: 0; font-family: var(--mono); }
  .result-row button.copy { flex-shrink: 0; }

  .entropy-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 14px; }
  .entropy-row .bits { font-size: 22px; font-weight: 500; }
  .entropy-row .bits .unit { font-size: 12px; color: var(--text-faint); margin-left: 6px; font-weight: 400; }
  .entropy-bar { flex: 1 1 160px; min-width: 100px; height: 6px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
  .entropy-bar .fill { height: 100%; border-radius: var(--radius-pill); transition: width 200ms ease; }
  .entropy-row .verdict { font-size: 12px; color: var(--text-faint); }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  button.primary .kbd { opacity: 0.6; font-size: 12px; margin-left: 8px; }

  nav.cmds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  nav.cmds button {
    font-family: var(--mono); font-size: 13px; background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 7px 15px; cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px; line-height: 1.3;
    transition: border-color 0.12s, color 0.12s, background 0.12s;
  }
  nav.cmds button .hint { font-size: 10px; color: var(--text-faint); opacity: 0.8; }
  nav.cmds button:hover { border-color: var(--border-active); color: var(--text); }
  nav.cmds button.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-tint); font-weight: 600; }
  nav.cmds button.active .hint { color: var(--accent); opacity: 0.75; }

  .opts { display: flex; flex-wrap: wrap; gap: 16px 24px; }
  .opt { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .opt.wide { flex-basis: 100%; }
  .opt > span.lbl { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); }

  .opt select, .opt input[type="number"], .opt input[type="text"], .opt textarea {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 12px;
  }
  .opt select { min-width: 170px; }
  .opt input[type="number"] { width: 96px; }
  .opt input[type="text"] { width: 100%; }
  .opt textarea { width: 100%; resize: vertical; line-height: 1.6; }
  .opt.wide input[type="text"], .opt.wide textarea { flex: 1; }

  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .toggle-pill {
    display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none;
    padding: 8px 14px 8px 11px; border-radius: var(--radius-pill); border: 1px solid var(--border);
    color: var(--text-faint); font-size: 12.5px; background: transparent;
    transition: border-color .12s, background .12s, color .12s;
  }
  .toggle-pill .dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--border-active); flex-shrink: 0; transition: background .12s; }
  .toggle-pill.on { border-color: var(--accent-dim); background: var(--accent-tint); color: var(--accent); }
  .toggle-pill.on .dot { background: var(--accent); }

  button.primary {
    font-family: var(--mono); font-size: 14px; font-weight: 500; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: var(--radius-control); padding: 12px 22px; cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.ghost {
    font-family: var(--mono); font-size: 13px; background: transparent; color: var(--text-dim);
    border: 1px solid var(--border-active); border-radius: var(--radius-control); padding: 12px 18px; cursor: pointer;
  }
  button.ghost:hover { background: var(--panel-nested); }
  button.subtle {
    font-family: var(--mono); font-size: 13px; background: transparent; color: var(--text-faint);
    border: 1px solid transparent; border-radius: var(--radius-control); padding: 12px 12px; cursor: pointer;
  }
  button.subtle:hover { color: var(--danger); }
  button.copy {
    font-family: var(--mono); font-size: 12px; background: var(--panel-nested); color: var(--text-dim);
    border: 1px solid var(--border-active); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button.copy:hover { border-color: var(--accent-dim); color: var(--accent); }
  button.copy.copied { color: var(--accent); border-color: var(--accent-dim); }

  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
  .report-cell { display: flex; flex-direction: column; gap: 4px; }
  .report-cell .lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }
  .report-cell .val { font-size: 14.5px; color: var(--text); word-break: break-all; }

  footer { margin-top: 14px; font-size: 12.5px; color: var(--text-faint); line-height: 1.7; }
  footer a { color: var(--accent); text-decoration: none; border-bottom: 1px solid oklch(0.78 0.13 168 / 0.35); }
  footer a:hover { color: var(--accent-hover); }
  footer code { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

  @media (max-width: 420px) { .opts { gap: 12px 16px; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="name">genid<span class="dot">.</span>web</span>
      <span class="badge">offline-capable</span>
    </div>
    <nav class="pages">
      <span class="current">genid</span>
      <a href="./devkit.html">devkit</a>
    </nav>
  </header>

  <div class="panel">
    <div class="panel-head">
      <span class="eyebrow" id="outputTitle">output — password</span>
      <span class="status" id="statusLine">ready</span>
    </div>
    <div id="results"></div>
    <div class="entropy-row hidden" id="entropyRow">
      <span class="bits" id="entropyBits">0<span class="unit">bits</span></span>
      <div class="entropy-bar"><div class="fill" id="entropyFill"></div></div>
      <span class="verdict" id="entropyVerdict"></span>
    </div>
    <div class="actions">
      <button class="primary" id="generateBtn">Generate<span class="kbd">↵</span></button>
      <button class="ghost" id="copyAllBtn">copy all</button>
      <button class="subtle" id="clearBtn">clear</button>
    </div>
  </div>

  <nav class="cmds" id="cmds"></nav>

  <div class="panel builder">
    <span class="eyebrow" id="optionsTitle">options</span>
    <div class="opts" id="opts"></div>
    <div class="toggles hidden" id="toggles"></div>
  </div>

  <div class="panel hidden" id="reportPanel">
    <div class="report-grid" id="reportGrid"></div>
  </div>

  <footer>
    Всё выполняется локально, через Web Crypto API (<code>crypto.getRandomValues</code>). Ничего не отправляется на сервер — можно отключить интернет после загрузки страницы.<br>
    Оригинальный CLI: <a href="https://github.com/rjusm/genid" target="_blank" rel="noopener">genid.sh</a>
  </footer>

</div>

<script>
(function () {
  "use strict";

  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  // ---------- RNG primitives ----------

  function randomBytes(n) {
    const b = new Uint8Array(n);
    crypto.getRandomValues(b);
    return b;
  }

  function randomInt(maxExclusive) {
    if (maxExclusive <= 1) return 0;
    let bytesNeeded = 1, range = 256;
    while (range < maxExclusive) { bytesNeeded++; range *= 256; }
    const limit = Math.floor(range / maxExclusive) * maxExclusive;
    while (true) {
      const b = randomBytes(bytesNeeded);
      let val = 0;
      for (let i = 0; i < bytesNeeded; i++) val = val * 256 + b[i];
      if (val < limit) return val % maxExclusive;
    }
  }

  function randomChar(charset) { return charset[randomInt(charset.length)]; }
  function randomString(charset, length) { let out = ""; for (let i = 0; i < length; i++) out += randomChar(charset); return out; }
  function toHex(bytes) { return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join(""); }
  function toBase64(bytes) { let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
  function filterOutChars(str, exclude) { return str.split("").filter(c => exclude.indexOf(c) === -1).join(""); }

  // ---------- charsets & word lists ----------

  const SETS = {
    lower: "abcdefghijklmnopqrstuvwxyz",
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    digits: "0123456789",
    symbols: "!@#$%^&*()-_=+[]{}?",
  };
  const AMBIGUOUS = "loIO01"; // matches genid.sh's `tr -d -- 'loIO01'`
  function stripAmbiguous(s) { return filterOutChars(s, AMBIGUOUS); }

  const PRESETS = { quick: 16, standard: 24, strong: 32, paranoid: 64 };

  const ADJ = ["brave","calm","dusty","eager","fuzzy","giant","happy","icy","jolly","keen",
    "lively","misty","noble","odd","proud","quiet","rapid","sharp","tidy","urban",
    "vivid","witty","young","zesty","amber","bold","crisp","dark","east","fine"];
  const NOUN = ["otter","falcon","river","cloud","tiger","maple","stone","ember","delta","harbor",
    "lynx","meadow","quartz","raven","summit","tundra","vale","willow","zephyr","comet",
    "dune","ridge","fern","glade","heron","ivy","jade","knoll","lark"];

  const PASSPHRASE_WORDS = ("amber anchor ant apple armor ash axe barley barrel basil basket bay "
    + "beach bean bear bee beetle beige belt bend berry bitter black blade "
    + "blend blue bold bolt boot boulder bowl box brave bread breeze bright "
    + "broad bronze brook brown bucket build butter button cake calm camel candle "
    + "candy canyon cape carrot carry carve catch cave celery chain chair chalk "
    + "chase cheese cherry chisel clam clasp clay clever cliff climb cloak clock "
    + "cloud cloudy clove clutch coast coat cocoa coffee cold comet cool copper "
    + "coral corn crab crane crate crawl creek crimson crisp crow crystal cyan "
    + "damp date dawn deep deer delta desert desk dew dive dolphin drag "
    + "drift drill drop dry duck dune dusk dust dusty eager eagle early "
    + "ember emerald equinox falcon fierce fig finch fjord flame flat float fog "
    + "foggy fold forest forge fork fox fresh frog frost frosty galaxy garlic "
    + "gather gear gecko gentle giant glacier glass glide glove goat gold goose "
    + "grab grand granite grape gravel gray green grip guava gulf hail hammer "
    + "harbor hat haul hawk heavy helmet heron hill hinge hold honest honey "
    + "hornet horse humble humid hunt icy indigo island ivory jade jolly jump "
    + "jungle kind kiwi knife koala ladder lake lamp lantern late leap lemon "
    + "lever lift light lime lion lively loyal lynx magenta mango marble maroon "
    + "marsh mast meadow melon merry meteor mild milk mint mirror mist misty "
    + "mix mold moon moose moth mouse mud muddy mug nail narrow navy "
    + "nebula needle newt night noon oar oat ocean olive onion onyx orange "
    + "orbit otter owl paddle panda papaya peach peak pear pearl pebble pepper "
    + "pie pink plain planet plate pliers plum pond potato pour prairie proud "
    + "pull pulley puma purple push quick quiet rabbit rain rainy raven red "
    + "reef release rice rich ridge river roam robin rock rocky rope rough "
    + "ruby run sage sail salt salty sand sandy sapphire saw scarf scarlet "
    + "screw seal shallow shape shark sheep shelf shield shiny shore shrimp silver "
    + "simple slate slope slow smooth snail snow snowy soar sock solstice sour "
    + "spark spicy spider spill spin spoon spring squid star steep stir stone "
    + "stork storm stormy strait stretch sturdy sugar summit sunny swamp swan sweet "
    + "swift swim syrup table tan tea teal thick thin thread throw thyme "
    + "tiger tiny toad toast tomato topaz torch toss tundra twist valley vase "
    + "vest violet walk wander warm wasp weave whale wheat wheel whisk white "
    + "wide wind windy wise wolf wren wrench yellow zebra zipper").split(" ");

  const CROCKFORD32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
  function crockfordEncode(value, nchars) {
    let out = "";
    for (let i = nchars - 1; i >= 0; i--) out += CROCKFORD32[Math.floor(value / Math.pow(2, i * 5)) % 32];
    return out;
  }

  // ---------- kinds ----------

  const KINDS = [
    { id: "password", label: "password", hint: "strong secrets", blurb: "CSPRNG characters, guaranteed class mix" },
    { id: "passphrase", label: "passphrase", hint: "words you can say", blurb: "real dictionary words, easy to remember" },
    { id: "username", label: "username", hint: "handles", blurb: "adjective + noun + digits" },
    { id: "uuid", label: "uuid", hint: "v4 / v7", blurb: "RFC 4122 / draft v7" },
    { id: "ulid", label: "ulid", hint: "sortable id", blurb: "timestamp + randomness, Crockford b32" },
    { id: "hex", label: "hex", hint: "raw bytes", blurb: "hexadecimal byte string" },
    { id: "base64", label: "base64", hint: "encoded bytes", blurb: "standard or URL-safe alphabet" },
    { id: "token", label: "token", hint: "api keys", blurb: "prefixed base62 secret" },
    { id: "inspect", label: "inspect", hint: "analyse a string", blurb: "format, entropy, likely type" },
  ];

  // ---------- generators (each returns { value, bits }) ----------

  function genPassword(o) {
    let classes = [SETS.lower, SETS.upper, SETS.digits];
    if (o.symbols) classes.push(SETS.symbols);
    if (o.noAmbiguous) classes = classes.map(stripAmbiguous);
    if (o.exclude) classes = classes.map(c => filterOutChars(c, o.exclude));
    if (classes.some(c => c.length === 0)) return { value: "(error: a character class is empty once filters are applied)", bits: 0 };
    const charset = classes.join("");
    const length = o.preset === "custom" ? Math.max(classes.length, o.length || 24) : PRESETS[o.preset];
    const pass = classes.map(c => c[randomInt(c.length)]);
    for (let i = 0; i < length - classes.length; i++) pass.push(charset[randomInt(charset.length)]);
    for (let i = pass.length - 1; i > 0; i--) { const j = randomInt(i + 1); [pass[i], pass[j]] = [pass[j], pass[i]]; }
    const bits = Math.round(length * Math.log2(charset.length) * 10) / 10;
    return { value: pass.join(""), bits };
  }

  function genPassphrase(o) {
    const words = Math.max(2, o.words || 5);
    const parts = [];
    for (let i = 0; i < words; i++) {
      let w = PASSPHRASE_WORDS[randomInt(PASSPHRASE_WORDS.length)];
      if (o.capitalize) w = w[0].toUpperCase() + w.slice(1);
      parts.push(w);
    }
    const bits = Math.round(words * Math.log2(PASSPHRASE_WORDS.length) * 10) / 10;
    return { value: parts.join(o.phraseSep || "-"), bits };
  }

  function genUsername(o) {
    const digitSuffix = o.digits > 0 ? String(randomInt(Math.pow(10, o.digits))).padStart(o.digits, "0") : "";
    const digitBits = o.digits > 0 ? o.digits * Math.log2(10) : 0;
    if (o.style === "handle") {
      const bits = Math.round((Math.log2(NOUN.length) + digitBits) * 10) / 10;
      return { value: NOUN[randomInt(NOUN.length)] + digitSuffix, bits };
    }
    const bits = Math.round((Math.log2(ADJ.length) + Math.log2(NOUN.length) + digitBits) * 10) / 10;
    if (o.style === "codename") {
      return { value: (ADJ[randomInt(ADJ.length)] + "_" + NOUN[randomInt(NOUN.length)]).toUpperCase() + digitSuffix, bits };
    }
    return { value: ADJ[randomInt(ADJ.length)] + (o.usernameSep || "-") + NOUN[randomInt(NOUN.length)] + digitSuffix, bits };
  }

  function genUuid(o) {
    const bytes = randomBytes(16);
    if (o.uuidVersion === "7") {
      const ts = Date.now();
      const tsHex = ts.toString(16).padStart(12, "0");
      for (let i = 0; i < 6; i++) bytes[i] = parseInt(tsHex.substr(i * 2, 2), 16);
      bytes[6] = (bytes[6] & 0x0f) | 0x70;
    } else {
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
    }
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const h = toHex(bytes);
    let v = [h.slice(0,8), h.slice(8,12), h.slice(12,16), h.slice(16,20), h.slice(20)].join("-");
    if (o.uuidUpper) v = v.toUpperCase();
    return { value: v, bits: o.uuidVersion === "7" ? 74 : 122 };
  }

  function genUlid(o) {
    const ms = Date.now();
    const tsPart = crockfordEncode(ms, 10);
    const r1 = randomBytes(5).reduce((v, b) => v * 256 + b, 0);
    const r2 = randomBytes(5).reduce((v, b) => v * 256 + b, 0);
    let v = tsPart + crockfordEncode(r1, 8) + crockfordEncode(r2, 8);
    if (o.ulidUpper === false) v = v.toLowerCase();
    return { value: v, bits: 80 };
  }

  function genHex(o) {
    const n = o.hexBytes || 32;
    let v = toHex(randomBytes(n));
    if (o.hexUpper) v = v.toUpperCase();
    if (o.hexPrefix) v = "0x" + v;
    return { value: v, bits: n * 8 };
  }

  function genBase64Kind(o) {
    const n = o.b64Bytes || 32;
    let v = toBase64(randomBytes(n));
    if (o.b64UrlSafe) v = v.replace(/\+/g, "-").replace(/\//g, "_");
    if (!o.b64Padding) v = v.replace(/=+$/, "");
    return { value: v, bits: n * 8 };
  }

  function genToken(o) {
    const bytesEq = o.tokenBytes || 32;
    const bodyLen = Math.max(8, Math.round(bytesEq * 1.34));
    const B62 = SETS.digits + SETS.upper + SETS.lower;
    const body = randomString(B62, bodyLen);
    return { value: (o.tokenPrefix ? o.tokenPrefix + "_" : "") + body, bits: bytesEq * 8 };
  }

  const GENERATORS = {
    password: genPassword, passphrase: genPassphrase, username: genUsername,
    uuid: genUuid, ulid: genUlid, hex: genHex, base64: genBase64Kind, token: genToken,
  };

  // ---------- inspect: precise UUID/ULID decode + general string analysis ----------

  function analyseString(raw) {
    const s = (raw || "").trim();
    if (!s) return null;

    let structural = null;
    if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)) {
      const stripped = s.toLowerCase().replace(/-/g, "");
      const version = stripped[12];
      let timestamp = null;
      if (version === "7") {
        const ms = parseInt(stripped.slice(0, 12), 16);
        timestamp = new Date(ms).toISOString().replace("T", " ").replace("Z", " UTC");
      }
      structural = { kind: "UUID", label: "UUID v" + version, version, timestamp };
    } else if (/^[0-9A-HJKMNP-TV-Z]{26}$/i.test(s)) {
      const upper = s.toUpperCase();
      let val = 0;
      for (const c of upper.slice(0, 10)) val = val * 32 + CROCKFORD32.indexOf(c);
      const ms = val % Math.pow(2, 48);
      structural = { kind: "ULID", label: "ULID", timestamp: new Date(ms).toISOString().replace("T", " ").replace("Z", " UTC") };
    }

    let size = 0;
    if (/[a-z]/.test(s)) size += 26;
    if (/[A-Z]/.test(s)) size += 26;
    if (/[0-9]/.test(s)) size += 10;
    const others = new Set(s.split("").filter(c => !/[a-zA-Z0-9]/.test(c)));
    size += others.size;

    let guess = structural ? structural.label : "opaque string";
    if (!structural) {
      const bare = s.replace(/^0x/i, "");
      if (/^[0-9a-f]+$/i.test(bare) && bare.length % 2 === 0) guess = "hex (" + (bare.length / 2) + " bytes)";
      else if (/^[a-z]+([-_][a-z]+){1,8}$/i.test(s)) guess = "passphrase / handle";
      else if (/^[a-z][a-z0-9]*(_[a-z0-9]+)*_[A-Za-z0-9]{16,}$/i.test(s)) guess = "prefixed API token";
      else if (/^[A-Za-z0-9+/]+={0,2}$/.test(s) && s.length % 4 === 0) guess = "base64";
      else if (/^[A-Za-z0-9_-]+={0,2}$/.test(s) && /[-_]/.test(s)) guess = "base64url";
    }

    const bits = Math.round(Math.log2(Math.max(size, 2)) * s.length * 10) / 10;
    return { s, size, bits, guess, unique: new Set(s.split("")).size, structural };
  }

  // ---------- field/toggle descriptors per kind ----------

  function sel(id, label, value, options) { return { id, label, kind: "select", value, options }; }
  function num(id, label, value, min, max) { return { id, label, kind: "number", value, min, max }; }
  function txt(id, label, value, placeholder, wide) { return { id, label, kind: "text", value, placeholder, wide }; }
  function area(id, label, value, placeholder) { return { id, label, kind: "textarea", value, placeholder, wide: true }; }

  function fieldsFor(kind, o) {
    if (kind === "password") return [
      sel("preset", "strength", o.preset, [["quick","quick · 16"],["standard","standard · 24"],["strong","strong · 32"],["paranoid","paranoid · 64"],["custom","custom"]]),
      ...(o.preset === "custom" ? [num("length", "length", o.length, 4, 256)] : []),
      txt("exclude", "exclude chars", o.exclude, "e.g. {}[]"),
      num("count", "count", o.count, 1, 50),
    ];
    if (kind === "passphrase") return [
      num("words", "words", o.words, 2, 12),
      txt("phraseSep", "separator", o.phraseSep, "-"),
      num("count", "count", o.count, 1, 50),
    ];
    if (kind === "username") return [
      sel("style", "style", o.style, [["adjnoun","adjective-noun"],["handle","single word"],["codename","CODENAME"]]),
      num("digits", "digits", o.digits, 0, 6),
      ...(o.style === "adjnoun" ? [txt("usernameSep", "separator", o.usernameSep, "-")] : []),
      num("count", "count", o.count, 1, 50),
    ];
    if (kind === "uuid") return [sel("uuidVersion", "version", o.uuidVersion, [["4","v4 · random"],["7","v7 · time-sortable"]]), num("count", "count", o.count, 1, 50)];
    if (kind === "ulid") return [num("count", "count", o.count, 1, 50)];
    if (kind === "hex") return [num("hexBytes", "bytes", o.hexBytes, 1, 512), num("count", "count", o.count, 1, 50)];
    if (kind === "base64") return [num("b64Bytes", "bytes", o.b64Bytes, 1, 512), num("count", "count", o.count, 1, 50)];
    if (kind === "token") return [txt("tokenPrefix", "prefix", o.tokenPrefix, "sk"), num("tokenBytes", "entropy bytes", o.tokenBytes, 8, 128), num("count", "count", o.count, 1, 50)];
    if (kind === "inspect") return [area("subject", "string to inspect", o.subject, "paste a key, token, uuid…")];
    return [];
  }

  function togglesFor(kind, o) {
    if (kind === "password") return [["symbols", "symbols", o.symbols], ["noAmbiguous", "no ambiguous chars", o.noAmbiguous]];
    if (kind === "passphrase") return [["capitalize", "capitalize words", o.capitalize]];
    if (kind === "uuid") return [["uuidUpper", "uppercase", o.uuidUpper]];
    if (kind === "ulid") return [["ulidUpper", "uppercase", o.ulidUpper]];
    if (kind === "hex") return [["hexUpper", "uppercase", o.hexUpper], ["hexPrefix", "0x prefix", o.hexPrefix]];
    if (kind === "base64") return [["b64UrlSafe", "url-safe alphabet", o.b64UrlSafe], ["b64Padding", "keep padding", o.b64Padding]];
    return [];
  }

  // ---------- state ----------

  let currentKind = "password";
  let lastResults = [];
  let lastEntropy = null;
  let copiedIdx = null;
  let copiedAll = false;
  let copyResetTimer = null;

  const opts = {
    preset: "standard", length: 24, symbols: true, noAmbiguous: true, exclude: "",
    words: 5, phraseSep: "-", capitalize: false,
    style: "adjnoun", digits: 2, usernameSep: "-",
    uuidVersion: "4", uuidUpper: false,
    ulidUpper: true,
    hexBytes: 32, hexUpper: false, hexPrefix: false,
    b64Bytes: 32, b64UrlSafe: false, b64Padding: false,
    tokenPrefix: "sk", tokenBytes: 32,
    subject: "",
    count: 1,
  };

  const cmdsEl = document.getElementById("cmds");
  const optsEl = document.getElementById("opts");
  const togglesEl = document.getElementById("toggles");
  const resultsEl = document.getElementById("results");
  const entropyRowEl = document.getElementById("entropyRow");
  const entropyBitsEl = document.getElementById("entropyBits");
  const entropyFillEl = document.getElementById("entropyFill");
  const entropyVerdictEl = document.getElementById("entropyVerdict");
  const outputTitleEl = document.getElementById("outputTitle");
  const optionsTitleEl = document.getElementById("optionsTitle");
  const statusLineEl = document.getElementById("statusLine");
  const reportPanelEl = document.getElementById("reportPanel");
  const reportGridEl = document.getElementById("reportGrid");
  const generateBtn = document.getElementById("generateBtn");

  function copyText(text, onDone) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(onDone).catch(() => legacyCopy(text) && onDone());
    } else {
      if (legacyCopy(text)) onDone();
    }
  }
  function legacyCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function renderTabs() {
    cmdsEl.innerHTML = "";
    KINDS.forEach(k => {
      const btn = document.createElement("button");
      const label = document.createElement("span");
      label.textContent = k.label;
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = k.hint;
      btn.appendChild(label);
      btn.appendChild(hint);
      btn.className = k.id === currentKind ? "active" : "";
      btn.addEventListener("click", () => {
        currentKind = k.id;
        lastResults = []; lastEntropy = null; copiedIdx = null; copiedAll = false;
        renderTabs(); renderOptions(); renderOutput();
        generateBtn.innerHTML = k.id === "inspect" ? "Analyse<span class=\"kbd\">↵</span>" : "Generate<span class=\"kbd\">↵</span>";
        if (k.id !== "inspect") run();
      });
      cmdsEl.appendChild(btn);
    });
  }

  function renderOptions() {
    const meta = KINDS.find(k => k.id === currentKind);
    optionsTitleEl.textContent = "options — " + meta.blurb;
    optsEl.innerHTML = "";
    fieldsFor(currentKind, opts).forEach(f => {
      const wrap = document.createElement("label");
      wrap.className = "opt" + (f.wide ? " wide" : "");
      const lbl = document.createElement("span");
      lbl.className = "lbl";
      lbl.textContent = f.label;
      wrap.appendChild(lbl);

      if (f.kind === "select") {
        const select = document.createElement("select");
        f.options.forEach(([val, text]) => {
          const o = document.createElement("option");
          o.value = val; o.textContent = text;
          if (val === f.value) o.selected = true;
          select.appendChild(o);
        });
        select.addEventListener("change", () => { opts[f.id] = select.value; renderOptions(); if (currentKind !== "inspect") run(); });
        wrap.appendChild(select);
      } else if (f.kind === "number") {
        const input = document.createElement("input");
        input.type = "number"; input.min = f.min; input.max = f.max; input.value = f.value;
        input.addEventListener("change", () => {
          let v = parseInt(input.value, 10);
          if (isNaN(v)) v = f.min;
          v = Math.max(f.min, Math.min(f.max, v));
          opts[f.id] = v; input.value = v;
          if (currentKind !== "inspect") run();
        });
        wrap.appendChild(input);
      } else if (f.kind === "text") {
        const input = document.createElement("input");
        input.type = "text"; input.value = f.value || ""; if (f.placeholder) input.placeholder = f.placeholder;
        input.addEventListener("input", () => { opts[f.id] = input.value; });
        input.addEventListener("change", () => { if (currentKind !== "inspect") run(); });
        wrap.appendChild(input);
      } else if (f.kind === "textarea") {
        const ta = document.createElement("textarea");
        ta.rows = 3; ta.value = f.value || ""; if (f.placeholder) ta.placeholder = f.placeholder;
        ta.addEventListener("input", () => { opts[f.id] = ta.value; run(); });
        wrap.appendChild(ta);
      }
      optsEl.appendChild(wrap);
    });

    const toggles = togglesFor(currentKind, opts);
    togglesEl.innerHTML = "";
    togglesEl.classList.toggle("hidden", toggles.length === 0);
    toggles.forEach(([id, label, on]) => {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "toggle-pill" + (on ? " on" : "");
      pill.innerHTML = '<span class="dot"></span><span>' + label + "</span>";
      pill.addEventListener("click", () => { opts[id] = !opts[id]; renderOptions(); if (currentKind !== "inspect") run(); });
      togglesEl.appendChild(pill);
    });
  }

  function makeCopyBtn(getText, idx) {
    const btn = document.createElement("button");
    btn.className = "copy";
    const isCopied = idx === "all" ? copiedAll : copiedIdx === idx;
    btn.textContent = isCopied ? "copied ✓" : "copy";
    btn.addEventListener("click", () => {
      copyText(getText(), () => {
        if (idx === "all") copiedAll = true; else copiedIdx = idx;
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => { copiedAll = false; copiedIdx = null; renderOutput(); }, 1400);
        renderOutput();
      });
    });
    return btn;
  }

  function renderOutput() {
    const meta = KINDS.find(k => k.id === currentKind);
    outputTitleEl.textContent = "output — " + meta.label;
    statusLineEl.textContent = lastResults.length
      ? lastResults.length + (lastResults.length === 1 ? " value" : " values") + " · local only"
      : "ready";

    resultsEl.innerHTML = "";
    if (lastResults.length === 0) {
      const box = document.createElement("div");
      box.className = "empty-box";
      box.textContent = "— результат появится здесь —";
      resultsEl.appendChild(box);
    } else {
      lastResults.forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "result-row";
        row.innerHTML = '<span class="prompt">&gt;</span>';
        const code = document.createElement("code");
        code.textContent = r;
        row.appendChild(code);
        row.appendChild(makeCopyBtn(() => r, i));
        resultsEl.appendChild(row);
      });
    }

    if (lastEntropy != null) {
      entropyRowEl.classList.remove("hidden");
      entropyBitsEl.innerHTML = lastEntropy + '<span class="unit">bits</span>';
      const pct = Math.min(100, Math.round((lastEntropy / 160) * 100));
      entropyFillEl.style.width = pct + "%";
      entropyFillEl.style.background = lastEntropy >= 80 ? "var(--accent)" : lastEntropy >= 50 ? "var(--warn)" : "var(--danger)";
      entropyVerdictEl.textContent = lastEntropy >= 128 ? "far beyond brute force" : lastEntropy >= 80 ? "strong for online secrets" : lastEntropy >= 50 ? "fine for low-risk use" : "weak — raise length";
    } else {
      entropyRowEl.classList.add("hidden");
    }

    // copy-all button lives outside this render pass; refresh its label directly
    const copyAllBtn = document.getElementById("copyAllBtn");
    copyAllBtn.textContent = copiedAll ? "copied ✓" : "copy all";
  }

  function renderReport(report) {
    if (!report) { reportPanelEl.classList.add("hidden"); reportGridEl.innerHTML = ""; return; }
    reportPanelEl.classList.remove("hidden");
    reportGridEl.innerHTML = "";
    report.forEach(row => {
      const cell = document.createElement("div");
      cell.className = "report-cell";
      cell.innerHTML = '<span class="lbl"></span><span class="val"></span>';
      cell.querySelector(".lbl").textContent = row.label;
      cell.querySelector(".val").textContent = row.value;
      reportGridEl.appendChild(cell);
    });
  }

  function run() {
    if (currentKind === "inspect") {
      const a = analyseString(opts.subject);
      if (!a) { lastResults = []; lastEntropy = null; renderOutput(); renderReport(null); return; }
      lastResults = [a.s];
      lastEntropy = a.bits;
      const report = [
        { label: "likely format", value: a.guess },
        { label: "length", value: a.s.length + " chars" },
        { label: "charset size", value: "≈ " + a.size },
        { label: "unique chars", value: a.unique },
        { label: "entropy", value: "≈ " + a.bits + " bits" },
      ];
      if (a.structural && a.structural.timestamp) report.push({ label: a.structural.kind + " timestamp", value: a.structural.timestamp });
      renderReport(report);
      renderOutput();
      return;
    }
    renderReport(null);
    const n = Math.min(50, Math.max(1, Number(opts.count) || 1));
    const gen = GENERATORS[currentKind];
    const out = [];
    let bits = 0;
    for (let i = 0; i < n; i++) { const r = gen(opts); out.push(r.value); bits = r.bits; }
    lastResults = out;
    lastEntropy = bits;
    renderOutput();
  }

  generateBtn.addEventListener("click", run);
  document.getElementById("copyAllBtn").addEventListener("click", () => {
    if (!lastResults.length) return;
    copyText(lastResults.join("\n"), () => {
      copiedAll = true;
      clearTimeout(copyResetTimer);
      copyResetTimer = setTimeout(() => { copiedAll = false; renderOutput(); }, 1400);
      renderOutput();
    });
  });
  document.getElementById("clearBtn").addEventListener("click", () => {
    lastResults = []; lastEntropy = null; renderReport(null); renderOutput();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey || e.target === document.body)) run();
  });

  renderTabs();
  renderOptions();
  run();
})();
</script>
</body>
</html>
